<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>6</title>
    <style>
        .box1{
            background-color: pink;
            height: 400px;
            width: 600px;
            border: 2px solid black;
             line-height: 100px;
            text-align: center;
            position: relative;
        }
        .box2{
             background-color: green;
            height: 200px;
            width: 400px;
            border: 2px solid black;
             line-height: 100px;
            text-align: center;
            position: absolute;
            bottom: 20px;
            left: 100px;
        }
        .box3{
            height: 100px;
            width: 100px;
            background-color: yellow;
            border: 2px solid black;
            line-height: 100px;
            text-align: center;
            position: absolute;
            bottom: -50px;
            left: 40px;
        }
    </style>
</head>
<body>
    <div class="box1">parent
        <div class="box2"> child
            <div class="box3">element</div>
        </div>
    </div>
