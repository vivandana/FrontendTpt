<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
    <style>
        .outer{
            height: 200px;
            width: 200px;
            background-color: orangered;
            position: relative;
            margin: 100px auto;
        }
        .a{
            height: 100px;
            width: 100px;
            position: absolute;
            top: -50%;
            left: -50%;
            background-color: green;
        }
          .b{
            height: 100px;
            width: 100px;
            position: absolute;
            top: -50%;
            right: -50%;
            background-color: blue;
        }
          .c{
            height: 100px;
            width: 100px;
            position: absolute;
            bottom: -50%;
            left: -50%;
            background-color: orange;
        }
          .d{
            height: 100px;
            width: 100px;
            position: absolute;
            bottom: -50%;
            right: -50%;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"></div>
        <div class="d"></div>
    </div>
</body>
</html>
