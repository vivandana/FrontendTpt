<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18</title>
    <style>
        body {
            background-color: rgb(77, 74, 74);
        }

        .box {
            height: 1000px;
            width: 2000px;
            margin: 200px auto;
        }

        .left {
            height: 1000px;
            width: 600px;
            float: left;
            background-color: white;
            padding: 40px;
            box-sizing: border-box;
            padding-top: 200px;
            text-align: center;
        }

        .right {
            height: 1000px;
            width: 1000px;
            padding: 100px;
            box-sizing: border-box;
            text-align: center;
            float: left;
            /* background-color: rgb(239, 9, 239); */
            background: url("pink3.png");
            background-repeat: no-repeat;
            background-size: cover;
        }



        .input-container {
            position: relative;
            width: 250px;
        }


        .input-container .icon {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            /* So icon doesn't block clicking input */
            font-size: 18px;
        }

        .input-container input {
            border: rgb(239, 9, 239) solid 3px;
            width: 450px;
            height: 50px;
            margin: 20px;
            padding: 10px 10px 10px 35px;
            /* Leave space for icon */
            box-sizing: border-box;
            font-size: 16px;
            border-radius: 30px;
        }

        h1 {
            color: rgb(239, 9, 239);
            font-weight: bold;
            font-size: 40px;

        }
        .btn{
            height: 50px;
            width: 250px;
            background-color: rgb(239, 9, 239);
            color: white;
            border-radius: 30px;
            border: none;
            margin: 10px;
        }
        .ic{
           height: 100px;
           width: 100px;
           /* background-color: antiquewhite; */
            border: 2px black solid;
            margin: 5px;
            border-radius: 50%;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="left">
            <h1>Sign In</h1>
            <div class="input-container">
                <span class="icon">🔍</span>
                <input type="text" placeholder="Username">
            </div>
            <div class="input-container">
                <span class="icon">🔍</span>
                <input type="text" placeholder="Password">
            </div>
            <input type="submit"  class="btn" value="LOGIN">
            <p style="font-size: 20px;">Or Sign in with social platform</p>

           <span class=" ic">🔍</span><span class=" ic">🔍</span><span class=" ic">🔍</span>

<span class=" ic">🔍</span>


        </div>
        <div class="right">
            <h1 style="color: gray; font-size: 50px; margin: 30px;">New to Brand?</h1>
            <p style="text-align: center; color: gray;">Lorem ipsum dolor sit amet consectetur  adipisicing elit. Explicabo veritatis ducimus, <br> laboriosam natus praesentium officia.</p>
             <input type="submit"  class="btn" value="SIGN UP">
        </div>
    </div>
</body>

</html>
