<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19</title>
    <style>
        body{
            background: url('square.jpeg');
            background-repeat: no-repeat;
            background-size: 100% 2000px;

        }
        .div{
            height: 1000px;
            width: 1000px;
            box-shadow: 0px 0px 5px 10px rgb(5, 162, 235);
            background-color: navy;
            margin: 300px auto;
            padding: 40px;
            box-sizing: border-box;
        }
        .content{
            color: whitesmoke;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            margin: 20px;

        }
        .form{
            padding: 20px;
            padding-left: 100px;
            box-sizing: border-box;
            margin: 30px;
            color: rgb(5, 162, 235);
        }
        input{
            border-bottom: 2px solid rgb(5, 162, 235);
            height: 40px;
            width: 600px;
            border-left: none;
            border-right: none;
            border-top: none;
            background: none;
            margin: 30px;
        }
        ::placeholder{
            color: rgb(5, 162, 235);
        }
        .btn{
            height: 40px;
            width: 300px;
            border: 2px solid whitesmoke;
            color: whitesmoke;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
            margin-left: 200px;
            font-size: 25px;
        }

    </style>

</head>
<body>
    <div class="div">
       <div class="content">
         <h1 style="text-transform: uppercase;color: whitesmoke; font-size:50px">contact us</h1>
        <p style="font-size: 28px; line-height: 50px;">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Accusamus deserunt nemo necessitatibus .</p>
       </div>

       <div class="form">
        <input type="text" placeholder="Your Name"> <br>
        <input type="text" placeholder="Your Mail"> <br>
        <input type="text" placeholder="Your Message"> <br>
        <input type="submit" value="Submit  &rarr;" class="btn"> <br>
       </div>
    </div>
</body>
</html>
