<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17</title>
    <style>
        body{
           background: linear-gradient(60deg,rgb(16, 16, 176),pink);
           background-repeat: no-repeat;
        }
        h1{
            font-size: 45px;
            font-weight: bold;
        }
        .form{
            height: 450px;
            width: 300px;
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
        }
        input{
            border-left: none;
            border-top: none;
            border-right: none;
            border-bottom: gray solid 2px;
            height: 30px;
            width: 200px;
            margin: 10px;
        }
        .btn{
            height: 50px;
            width: 200px;
            background: linear-gradient(60deg,rgb(16, 16, 176),pink);
            border: none;
        }
        .d{
            padding: 20px;
        }

    </style>
</head>
<body>
    <div class="form">

        <h1>Login</h1>
        <input type="text" placeholder="Email"> <br>
        <input type="text" placeholder="Password"> <br>
        <input type="submit" value="Login" class="btn"> <br>


       <div class="d"> <span>Forgot <a href="">Password?</a></span> <br>
        <span>Don't have an account?<a href="">Sign Up</a></span></div>


    </div>
</body>
</html>
