<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3</title>
    <style>
        body{
            background-color: aliceblue;
        }
        .div{
            height: 400px;
            width: 400px;
            background-color: white;
            margin: 100px auto;
            color:white;
            position: relative;
            line-height: 100px;
            text-align: center;
        }
        .a{
            height: 100px;
            width: 100px;
            background-color: brown;
            position: absolute;
            top: 0%;
            left: 0%;
        }
         .b{
            height: 100px;
            width: 100px;
            background-color: green;
            position: absolute;
            top: 0%;
            right: 0%;
        }
         .c{
            height: 100px;
            width: 100px;
            background-color: gray;
            position: absolute;
            top: 40%;
            left: 40%;
        }
         .d{
            height: 100px;
            width: 100px;
            background-color: blue;
            position: absolute;
            bottom: 0%;
            left: 0%;
        }
         .e{
            height: 100px;
            width: 100px;
            background-color: purple;
            position: absolute;
            bottom: 0%;
            right: 0%;
        }
    </style>
</head>
<body>
    <div class="div">
        <div class="a">Red</div>
        <div class="b">Green</div>
        <div class="c">Gray</div>
        <div class="d">Blue</div>
        <div class="e">Purple</div>
    </div>
</body>
</html>
