<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16</title>
    <style>
        body{
            background-color: yellow;
        }
        .form{
            height: 700px;
            width: 800px;
            background: hotpink;
            margin: 100px auto;
            border-radius: 30px;
            

        }
        .left{
            height: 700px;
            width: 400px;
            float: left;
            background-color: white;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 20px 0px 0px 20px;
        }
        .right{
            height: 700px;
            width: 400px;
            float: left;
            background-color: orangered;
            color: white;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 0px 20px 20px 0px;

        }
        .icon{
            padding: 10px;
            font-size: 30px;
            border: 2px gainsboro solid;
            border-radius: 50%;
        }
        .ic{
            margin-top: 80px;
            margin-bottom: 80px;
        }
        input{
            height: 40px;
            width: 250px;
            margin: 10px;
            background: whitesmoke;
            border: none;
        }
        ::placeholder{
            padding-left: 15px;
            color: gray;
        }
        .btn{
            height: 50px;
            width: 150px;
            background-color: orangered;
            border-radius: 30px;
            text-transform: uppercase;
            color: white;
        }
        .con{
            margin-top: 250px;
        }

    </style>
</head>
<body>
    <div class="form">
        <div class="left">
            <h1><b>Login</b></h1>
            <div class="ic">
                 <span class="icon">🔍</span>
                  <span class="icon">🔍</span>
            </div>

            <p style="color: gray;">Or use your account</p>
            <input type="text" placeholder="Email"> <br>
            <input type="text" placeholder="Password">
            <p style="color: gray;">Forgot your password</p>
            <input type="submit" value="log in" class="btn">
        </div>
        <div class="right">
           <div class="con">
             <h1>
                HTML CSS LOGIN FORM
            </h1>
            <P>This login form is created using pure HTML & CSS. For special FontAwesome is used.</P>
           </div>
        </div>
    </div>
</body>
</html>
