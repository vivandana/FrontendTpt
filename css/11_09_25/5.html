<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5</title>
    <style>
        .box1{
            height: 400px;
            width: 400px;
            background-color: blueviolet;
            padding: 50px;
            box-sizing: border-box;

        }
        .box2{
             height: 300px;
            width: 300px;
            background-color: palevioletred;
            /* margin: 100px; */
            position: relative;

        }
        .box3{
            height: 200px;
            width: 200px;
            background-color: yellow;
            /* margin: 100px; */
            position: absolute;
            top: -30px;
            left: 50px;
            border: dashed black 2px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box1">
        <div class="box2">
            <div class="box3">Test</div>
        </div>
    </div>
</body>
</html>
