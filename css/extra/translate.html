<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate</title>
    <style>
        .a{
            height: 200px;
            width: 200px;
            background: red;
        }
         .b{
            height: 200px;
            width: 200px;
            background: navy;
            transform: translate(30px,40px);
        }
        .c{
            height: 200px;
            width: 200px;
            background: navajowhite;
            transform: translateX(60px); 
        }
        .d{
            height: 200px;
            width: 200px;
            background: palegreen;
            transform: translateY(60px); 
        }
        .e{
              height: 200px;
            width: 200px;
            background: lightgray;
            transform: rotate(45deg); 
        }
           .f{
              height: 200px;
            width: 200px;
            background: black;
            transform: rotate(-120deg);    
            }
        .g{
              height: 200px;
            width: 200px;
            /* background: green; */
            background: linear-gradient(45deg,lightgray 50%,lightgreen 50%);
            transform: rotateX(-189deg);    
        }
        .h{
             height: 200px;
            width: 200px;
            /* background: green; */
            background: linear-gradient(45deg,lightgray 50%,lightgreen 50%);
            transform: rotatey(-180deg); 
        }

    </style>
</head>
<body>
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
<div class="e"></div>
<div class="f"></div>
<div class="g"></div>
<div class="h"></div>
<div class="i"></div>
<div class="j"></div>










</body>
</html>
