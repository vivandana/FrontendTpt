<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        body{
            position: relative;
            overflow-x: hidden;
        }
        .outer{
            min-height: 450px;
            width: 400px;
            position: absolute;
            top: 40px;
            right: -360px;
            border-radius: 10px;
            /* border: 1px solid black; */
            transition:all 3s;

        }

        .outer:hover{
            right: 0px;
            transition:all 3s;

        }
        .left{
              min-height: 300px;
              width: 50px;
              float: left;
              background-color: lightsalmon;
            border-radius: 10px 0px 0px 10px;
            color: white;
            writing-mode: vertical-lr;
            font-size: 35px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            margin: 75px 0px;
            padding-top: 38px;
            padding-left: 4px;
            box-sizing: border-box;
           
        }
        .right{
              min-height: 450px;
              width: 350px;
              float: left;
              /* background-color: lightcoral; */
            border-radius:  10px ;
            /* color: white; */
            padding: 50px;
            box-sizing: border-box;
             box-shadow: 0px 0px 20px lightsalmon inset;
            background-color: white;
        }
        .t{
            height: 45px;
            width: 100%;
            padding-left: 15px;
            box-sizing: border-box;
            border: none;
            background-color: #e1e1e1;
            border-bottom: 3px solid lightsalmon;
            margin-top: 5px;
        }
        .ta{
            resize: none;
            height: 60px;
            width: 100%;
            padding-left: 15px;
            box-sizing: border-box;
            border: none;
            background-color: #e1e1e1;
            margin-top: 5px;
            border-bottom: 3px solid lightsalmon;
        }
        .btn{
            height: 30px;
            width: 100%;
            background-color: lightsalmon;
            border: none;
            margin-top: 5px;
        }

    </style>
</head>
<body>
    <div class="outer">
        <div class="left">CONTACT US</div>
        <div class="right">
            <div style="padding: 0; margin: 0px;font-weight: bold;font-size: 30px; text-align: center;">Contact <b style="color: lightsalmon;">Us</b></div>
            Name <br> <input type="text" placeholder="Name" class="t"> <br>
            Email <br> <input type="email" placeholder="Email"  class="t"> <br>
            Password <br> <input type="password" placeholder="Password"  class="t"> <br>
            Message <br><textarea placeholder="Message"  class="ta"></textarea> <br>
            <button class="btn">Save</button>

        </div>
    </div>
</body>
</html>
