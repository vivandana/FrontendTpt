<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            /* background-color: red; */
            box-shadow: 0px 0px 30px 5px gray;
            position: absolute;
           
        }
        .a1{
            background-color: red;
            top: 50px;
            left: 50px;
             z-index: 1;
        }
        .a2{
            background-color: plum;
            top: 100px;
            left: 100px;
             z-index: 2;
        }
        .a3{
            background-color: blue;
          top: 150px;
            left: 150px;
             z-index: 3;
        }
        .a4{
            background-color: yellowgreen;
            top: 200px;
            left: 200px;
             z-index: 4;
        }
    </style>
</head>
<body>
    <div class="a1"></div>
    <div class="a2"></div>
    <div class="a3"></div>
    <!-- highest value of z-index (a4) -->
    <div class="a4"></div>



</body>

</html>
