<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Simple Navbar</title>
    <style>
        /* Reset default margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Navbar styling */
        .navbar {
            background-color: #333;
            overflow: hidden;
        }

        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .navbar a:hover {
            background-color: #575757;
        }

        /* Right-aligned links */
        .navbar .right {
            float: right;
        }

        /* Responsive: stack vertically on small screens */
        @media screen and (max-width: 600px) {
            .navbar a, .navbar .right {
                float: none;
                display: block;
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
        <div class="right">
            <a href="#">Login</a>
            <a href="#">Register</a>
        </div>
    </div>

    <div style="padding:20px;">
        <h1>Welcome to My Website</h1>
        <p>This is an example of a simple responsive navigation bar using HTML and CSS.</p>
    </div>

</body>

</html>
