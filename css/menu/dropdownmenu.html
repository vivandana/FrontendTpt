<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dropdown Navbar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .navbar {
            background-color: #333;
        }

        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .navbar ul li {
            position: relative;
        }

        .navbar ul li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
        }

        .navbar ul li:hover {
            background-color: #444;
        }

        /* Dropdown styles */
        .navbar ul li ul {
            display: none;
            position: absolute;
            top: 48px;
            left: 0;
            background-color: #444;
            padding: 0;
            min-width: 150px;
        }

        .navbar ul li:hover ul {
            display: block;
        }

        .navbar ul li ul li a {
            padding: 10px;
        }

        .navbar ul li ul li a:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <ul>
            <li><a href="#">Home</a></li>
            <li>
                <a href="#">Services</a>
                <ul>
                    <li><a href="#">Web Design</a></li>
                    <li><a href="#">SEO</a></li>
                    <li><a href="#">Marketing</a></li>
                </ul>
            </li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>

</html>
