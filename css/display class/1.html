<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer
        {
            height: 410px;
            width: 100%;
            border: 1px solid black;
            margin: 50px auto;
            display: flex;
            flex-direction: row-reverse;
            /* flex-direction: column-reverse; */
            /* flex-direction: row;(default) */
            /* flex-direction: column; */
            /* flex-wrap: nowrap; (default)*/
            flex-wrap: wrap;
            justify-content: space-evenly;
            flex-flow: row wrap;

            /* align-items: center;  it works on single row*/ 
            /* align-content: stretch;  it works on multiple row*/
            /* align-content: flex-end; */
            /* align-content: flex-start; */
            /* align-content: space-around; */
            justify-content: center;
            align-content: center;
            /* align-items: ; */
           
        }
        .outer > div{
            height: 50px;
            width: 50px;
            background: red;
            border: 1px solid black;
            font-size: 30px;
            text-align: center;
            line-height: 50px;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
</body>
</html>
