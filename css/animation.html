<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .outer{
            height: 300px;
            width: 500px;
            text-align: center;
            line-height: 300px;
            font-size: 70px;
            font-weight: bold;
            margin: 190px auto;

            /* call animation */
            animation-name: abc;
            animation-duration: 1s;
            /* animation-iteration-count: 5; */
            animation-iteration-count: infinite;
            /* animation-direction: reverse; */
            /* animation-direction: alternate; */
            /* animation-direction: normal; */
            animation-direction: alternate-reverse;
            position: relative;
                animation-delay: 3s;
        }
        .outer:hover{
                animation-play-state: paused;
        }
        /* define animation */
        @keyframes abc {
            from{
                background-color: lemonchiffon;
                color: black;
                border-radius: 0px;
                right: 0px;
            }
            to{
                /* background-color: lightblue; */
                color: white;
                border-radius: 50%;
                right: 100px;
                border: 10px dotted black;

            }
         /*     0%{
                background-color: lemonchiffon;
                color: black;
                border-radius: 0px;
                right: 0px;
            }
            100%{
               
                color: white;
                border-radius: 50%;
                right: 100px;
                border: 10px dotted black;

            } */
        }
    </style>
</head>
<body>
    <div class="outer">
        Techpile
    </div>
</body>
</html>
