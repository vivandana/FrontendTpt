<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
         .form{
            height: 500px;
            width: 500px;
/* background: linear-gradient(rgba(228, 122, 122, 0.2),rgba(230, 12, 12, 0.2),rgba(208, 11, 11, 0.844),red); */
            position: absolute;
            top: 30px;
            left: 350px;
            padding: 90px;
            box-sizing: border-box;
            color: white;
            border-radius: 50%;
            border: dotted 10px black;
        }

        .ip{
            height: 30px;
            width: 300px;
            margin: 10px;
            border: 3px solid rgba(238, 18, 18, 0.7);

        }
        .btn{
            /* margin-left: 80px; */
            box-sizing: border-box;
            height: 30px;
            width: 100px;
            margin: 10px;
            border: white 3px solid;
            color: black;
            background: linear-gradient(rgba(228, 122, 122, 0.2),rgba(230, 12, 12, 0.2),rgba(208, 11, 11, 0.844)) ;
        }

    </style>
</head>
<body>
      <div class="form">
        Email <br>
        <input type="email" class="ip" placeholder="Enter Email"> <br>
        Phone <br>
        <input type="email" class="ip" placeholder="Enter Phone"> <br>
        Password <br>
        <input type="password" class="ip" placeholder="Enter Password"> <br>
        <input type="submit" value="Submit" class="btn">
    </div>
</body>
</html>
