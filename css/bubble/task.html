<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Task</title>
    <style>
        .box {
            margin: 50px auto;
            height: 400px;
            width: 400px;
            line-height: 400px;
            text-align: center;
            background: linear-gradient(45deg, rgba(2, 243, 146, 0.3), rgba(243, 4, 4, 0.4), rgba(250, 1, 163, 0.3), rgba(226, 11, 11, 0.3), rgba(1, 247, 148, 0.3)), url("11_09_25/pink3.png") no-repeat;
            border: 10px solid black;
            animation-name: xyz;
            animation-duration: 5s;
            animation-delay: 2s;
            animation-iteration-count: infinite;

        }

        font {
            font-size: 50px;
            font-weight: bold;
            color: red;
        }

        @keyframes xyz {
            0% {
                background: linear-gradient(45deg, rgba(2, 243, 146, 0.3), rgba(243, 4, 4, 0.4), rgba(250, 1, 163, 0.3), rgba(226, 11, 11, 0.3), #f21b1b4d), url("11_09_25/pink3.png") no-repeat;
                border: 10px dotted red;
                color: green;
            }
            20% {
                background: linear-gradient(45deg, rgba(2, 243, 146, 0.3), rgba(243, 4, 4, 0.4), rgba(250, 1, 163, 0.3), rgba(226, 11, 11, 0.3), rgba(47, 216, 18, 0.3)), url("11_09_25/pink3.png") no-repeat;
                border: 10px groove green;
                color: black;
            }
            40% {
                background: linear-gradient(45deg, rgba(2, 243, 146, 0.3), rgba(243, 4, 4, 0.4), rgba(250, 1, 163, 0.3), rgba(226, 11, 11, 0.3), rgba(71, 16, 222, 0.3)), url("11_09_25/pink3.png") no-repeat;
                border: 10px dashed blue;
                color: green;
            }
            60% {
                background: linear-gradient(45deg, rgba(2, 243, 146, 0.3), rgba(243, 4, 4, 0.4), rgba(250, 1, 163, 0.3), rgba(226, 11, 11, 0.3), rgba(126, 16, 148, 0.3)), url("11_09_25/pink3.png") no-repeat;
                border: 10px dotted white;
                color: green;
            }
            80% {
                background: linear-gradient(45deg, rgba(2, 243, 146, 0.3), rgba(243, 4, 4, 0.4), rgba(250, 1, 163, 0.3), rgba(179, 226, 11, 0.3), rgba(58, 1, 247, 0.3)), url("11_09_25/pink3.png") no-repeat;
                border: 10px groove red;
                color: blue;
            }
            100% {
                background: linear-gradient(45deg, rgba(183, 185, 19, 0.3), rgba(243, 4, 4, 0.4), rgba(250, 1, 163, 0.3), rgba(226, 11, 11, 0.3), rgba(1, 247, 148, 0.3)), url("11_09_25/pink3.png") no-repeat;
                border: 10px dashed black;
                color: green;
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <font>Vandana</font>
    </div>
</body>

</html>
