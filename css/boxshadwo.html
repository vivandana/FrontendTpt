<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box shadow</title>
    <style>
        .div{
            height: 200px;
            width: 200px;
            border: 20px groove black;
            margin: 100px auto;
            line-height: 200px;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
            /* border-radius: 50%; */
            border-radius: 120px;
            font-family: 'Arial Narrow Bold';
            /* box-shadow: 10px 10px 10px black; */
            /* box-shadow: 10px 10px 10px black,-10px -10px 10px blue,100px 100px 20px black; */

        }
        .div:hover{
            /* box-shadow: 10px 10px 10px black,-10px -10px 10px blue inset ; */
            /* box-shadow: 5px 5px 5px 10px blue; */
            box-shadow: 0px 0px 30px 10px blue;


        }
        .a{
            height: 50px;
            width: 50px;
            border: dotted 10px yellowgreen;
            border-radius: 50%;
            margin: 0px auto;
        }
        .a:hover{
            box-shadow:0px 0px 20px 20px green inset;
            transition:all 3s;

        }


        .b{
            height: 50px;
            width: 150px;
            background-color: crimson;
            border-radius: 2px;
            position: relative;
        }
        .c{
            height: 50px;
            width: 50px;
            background-color: crimson;
            border-radius: 2px;
            border-radius: 50%;
            position: absolute;
            top:20px;
            left: 20px;      
        }
    </style>
</head>
<body>
    <div class="div">Codehelper</div>



    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
</body>
</html>
