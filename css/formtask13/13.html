<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
    }

    .container {
      display: flex;
      width: 90%;
      max-width: 1100px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    /* Left side map */
    .map {
      flex: 1;
    }
    .map iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Right side form */
    .contact-form {
      flex: 1;
      padding: 40px;
    }

    .contact-form h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #333;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-bottom: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    .contact-form textarea {
      resize: none;
      height: 100px;
    }

    .contact-form button {
      margin-top: 15px;
      width: 120px;
      padding: 12px;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      border: none;
      color: #fff;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .contact-form button:hover {
      opacity: 0.9;
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- Map Section -->
    <div class="map">
   
        <iframe
  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.076770938561!2d-122.406417!3d37.785834!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808796417777%3A0x8085808796417777!2sGolden+Gate+Bridge!5e0!3m2!1sen!2sus!4v1694567890123!5m2!1sen!2sus"
  width="600"
  height="450"
  style="border:0;"
  allowfullscreen=""
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade"
></iframe>
    </div>

    <!-- Contact Form Section -->
    <div class="contact-form">
      <h2>Contact Us</h2>
      <form>
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email address" required>
        <input type="tel" placeholder="Phone Number" required>
        <textarea placeholder="Questions/Comments..." required></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
</body>
</html>
