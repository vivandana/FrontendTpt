<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form 1</title>
    <style>
        body {
            background-color: blue;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .div {
            height: 600px;
            width: 1200px;
            border-radius: 10px;
            background-color: whitesmoke;
            box-shadow: 0px 0px 30px 2px white;
            margin: 80px auto;
            box-sizing: border-box;
            padding: 50px;

        }

        .a{
            height: 600px;
            width: 400px;
            float: left;
        }
        .b{
            height: 600px;
            width:400px;
            float: left;
            padding-top: 130px;
            padding-bottom: 50px;
            box-sizing: border-box;
        }
        .c{
            height: 550px;
            width:300px;
            float: left;
            padding-top: 130px;
            box-sizing: border-box;
        }
        p {
            color: gainsboro;
            font-size: 20px;
            font-weight: bold;
        }

        input {
            height: 30px;
            width: 200px;
            background: none;
            border: 1px solid gainsboro;
            margin: 5px;

        }

        ::placeholder {
            color: gainsboro;
            padding-left: 15px;
        }
    </style>
</head>

<body>
    <div class="div">
        <div class="a">
             <h1 style="padding: 0px;margin: 0px;"><u style="color: blue;">Reg</u>istration </h1><br>
        <p>Personal Details</p>

        <br> <br>

        <br>

        <input type="text" placeholder="Enter ID Type">
        <br><br>

        <br><br>
        <input type="submit" value="Next &rarr;"  style="background-color: blue;color: white;">
        </div>
        <div class="b">
            
              Date of Birth <br>
        <input type="date" placeholder="Enter  birth date"> <br><br>
        Gender <br>
        <input type="text" placeholder="Enter  birth date"> <br><br>
        <p></p>

        <input type="text" placeholder="Enter   ID Number"> <br><br>

        <input type="text" placeholder="Enter ID Issue State"> <br>  <br>
        </div>
        <div class="c">
            Email <br>

 </body>

</html>
