<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    display: flex;
    max-width: 900px;
    background-color: white;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    border-radius: 8px;
    overflow: hidden;
}

.image-side {
    background: linear-gradient(rgba(217, 110, 110, 0.395)),url("../imgs.jpg");
    color: white;   
    padding: 40px;
    text-align: center;
    flex: 1;
}

.image-side h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.image-side p {
    font-size: 16px;
}

.registration-form {
    display: flex;
    flex-direction: column;
    padding: 30px;
    flex: 2;
}

.left-section,
.right-section {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 20px;
}

.right-section select,
.right-section input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 4px;
    border: 1px solid #ccc;
}

.payment-options {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
}

.registration-form input[type="text"],
.registration-form input[type="email"],
.registration-form input[type="tel"],
.registration-form select,
.registration-form input[type="range"] {
    width: 100%;
    padding: 10px;
    border-radius: 4px;
    border: 1px solid #ccc;
}

.form-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.form-buttons input[type="submit"] {
    background-color: #00796B;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 4px;
    cursor: pointer;
}

.form-buttons input[type="reset"] {
    background-color: #ccc;
    border: none;
    padding: 12px 20px;
    border-radius: 4px;
    cursor: pointer;
}

.form-buttons input[type="submit"]:hover {
    background-color: #00695C;
}

.form-buttons input[type="reset"]:hover {
    background-color: #b3b3b3;
}

    </style>
</head>

<body>
    <div class="container">
        <div class="image-side">
            <h2>REGISTER NOW</h2>
            <p>while seats are available!</p>
        </div>

        <form class="registration-form">
            <div class="left-section">
                <input type="text" placeholder="First Name *" required>
                <input type="text" placeholder="Last Name *" required>
                <input type="text" placeholder="Company *" required>
                <input type="email" placeholder="Email *" required>
                <input type="tel" placeholder="Phone Number *" required>
            </div>

            <div class="right-section">
                <label>Meal Preference</label>
                <select>
                    <option>Vegetarian</option>
                    <option>Non-Vegetarian</option>
                </select>

                <label>Payment Mode</label>
                <div class="payment-options">
                    <label><input type="radio" name="payment" value="cash" checked> Cash</label>
                    <label><input type="radio" name="payment" value="cheque"> Cheque</label>
                    <label><input type="radio" name="payment" value="demand-draft"> Demand Draft</label>
                </div>

                <input type="text" placeholder="DD/Cheque No.">
                <input type="text" placeholder="Drawn On (Bank Name)">
                <input type="text" placeholder="Payable At">

                <label>Donate Us</label>
                <input type="range" min="0" max="1000" value="500">
            </div>

            <div class="form-buttons">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>
</body>

</html>
