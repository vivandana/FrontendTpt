<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background-color: #4CAF50;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 100%;
    max-width: 400px;
    padding: 20px;
}

.contact-form {
    background-color: #fff;
    padding: 30px;
    border-radius: 6px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    text-align: center;
}

.contact-form h2 {
    margin-bottom: 10px;
    font-size: 24px;
}

.contact-form p {
    margin-bottom: 20px;
    color: #666;
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.contact-form button {
    width: 100%;
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
}

.contact-form button:hover {
    background-color: #45a049;
}

.footer-text {
    font-size: 12px;
    margin-top: 15px;
}

.footer-text a {
    text-decoration: none;
    color: #4CAF50;
}

</style>
</head>

<body>
    <div class="container">
        <form class="contact-form">
            <h2>Colorlib Contact Form</h2>
            <p>Contact us for custom quote.</p>
            <input type="text" placeholder="Your name" required>
            <input type="email" placeholder="Your Email Address" required>
            <input type="tel" placeholder="Your Phone Number (optional)">
            <input type="url" placeholder="Your Web Site (optional)">
            <textarea placeholder="Type your message here..." rows="5"></textarea>
            <button type="submit">Submit</button>
            <p class="footer-text">Designed by <a href="#">Colorlib</a></p>
        </form>
    </div>
</body>

</html>
