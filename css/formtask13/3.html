<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3</title>
    <style>
        body {
            background-color: rgb(69, 164, 69);
        }

        div {
            height: 300px;
            width: 300px;
            background-color: white;
            box-shadow: 0px 0px 30px 3px rgb(55, 52, 52);
            box-sizing: border-box;
            padding: 20px;
            margin: 50px auto;
            padding-top: 50px;
        }
        input{
            height: 45px;
            width: 250px;
            background-color: rgba(202, 200, 200, 0.55);
            margin: 8px;
            
            border: none;

        }
        ::placeholder{
            padding-left: 15px;
            box-sizing: border-box;
            color: gray;
        }
        p{
            padding-left: 30px;
        }
    </style>
</head>
<body>
    <div>
        <input type="text" placeholder="username"> <br>
        <input type="text" placeholder="password"> <br>
        <input type="submit" value="LOGIN" style="background-color: rgb(69, 164, 69);color: white;"> <br>
        <p>Not registered?<span style="color: rgb(69, 164, 69);">Create an account</span></p>
    </div>
</body>

</html>
