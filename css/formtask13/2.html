<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 form</title>
    <style>
        body{
            background-color: rgba(24, 196, 44, 0.687);
        }
        div{
            height: 500px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px 3px rgba(24, 196, 44, 0.687);
            margin: 40px auto;
            box-sizing: border-box;
            padding: 20px;
            justify-content: center;
            justify-items: center;
            text-align: center;
            align-items: center;
            background: white;

        }
        h1{
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
        }
        input{
            height: 30px;
            width: 300px;
            background: none;
            border: 1px solid gainsboro;
            margin: 10px;
        }
        ::placeholder{
            color: gray;
            padding-left: 10px;
        }
        textarea{
            height: 70px;
            resize: none;
            width: 300px;
            background: none;
            border: 1px solid gainsboro;
            margin: 10px;

        }

        .btn{
            height: 30px;
            width: 300px;
            border-radius: 30px;
            border: none;
            background: rgba(24, 196, 44, 0.687);
        }
        

    </style>
</head>
<body>
    <div>
<h1>Contact us</h1>
<form action="">
    <input type="text" placeholder="Name"><br>
    <input type="text" placeholder="Subject"><br>
    <input type="tel" placeholder="Phone"><br>
    <input type="email" placeholder="Email"><br>
    <textarea name="" id=""></textarea>
    <input type="submit" class="btn" placeholder="SUBMIT"><br>
</form>
    </div>
</body>
</html>
