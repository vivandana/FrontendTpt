<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow</title>
    <style>
        h1{
            color: powderblue;
            font-size: 100px;
            text-align: center;
            line-height: 600px;
            transition: 1s;

        }
        h1:hover{
            /* text-shadow: 100px -100px 10px black; */
            /* multiple color shadow */
            transition:all 1s;
text-shadow: 100px 100px 5px blue , -100px -100px 5px yellowgreen, 200px 200px 5px red,-200px -200px 5px green;
        }
    </style>
</head>
<body>
    <h1>
        Vandana
    </h1>
</body>
</html>
