<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Gradient</title>
    <style>
        body {
            background: linear-gradient(red, orange, yellow);
        }

        div {
            height: 300px;
            width: 400px;
            border: 5px solid black;
            float: left;
            border-radius: 10px;
        }

        .a1 {
            background: linear-gradient(aqua, green, plum,red,orange,blue);
        }

        .a2 {
            background: linear-gradient(to left, aqua, green, plum,purple,blue);
        }

        .a3 {
            background: linear-gradient(to right, aqua, green, plum,yellowgreen);
        }

        /* direction -- to left, to right, to bottom, to top*/
        .a4 {
            background: linear-gradient(to top, aqua, green, plum);
        }

        .a5 {
            background: linear-gradient(45deg, aqua, green, plum);
        }

        .a6 {
            background: linear-gradient(70deg, aqua, green, plum);
        }

        .a7 {
            background: linear-gradient(120deg, aqua, green, plum);
        }

        .a8 {
            background: repeating-linear-gradient(red 5%, yellow 10%, orange 15%);
        }

        .a9 {
            background: repeating-linear-gradient(45deg, orange 5%, white 10%, green 15%);
        }

        .a10 {
            background: repeating-linear-gradient(to left, orange 5%, white 10%, green 15%);
        }

        .a11 {
            background: radial-gradient(plum, purple, orange, green, red, blue, yellowgreen, yellow);
        }

        .a12 {
            background: radial-gradient(circle, plum, purple, orange, green, red, blue, yellowgreen, yellow);
        }

        /* default value of circle */
        /* first value x-axis */
        /* second value y-axis */
        .a13 {
            background: radial-gradient(circle at 50% 50%, plum, purple, orange, green, red, blue, peru, yellow);
        }

        .a14 {
            background: radial-gradient(circle at 0% 50%, plum, purple, orange, green, red, blue, peru, yellow);
        }

        .a15 {
            background: radial-gradient(circle at 100% 50%, plum, purple, orange, green, red, blue, peru, yellow);
        }

        .a16 {
            background: radial-gradient(circle at 100% 100%, plum, purple, orange, green, red, blue, peru, yellow);
        }

        .a17 {
            background: radial-gradient(circle at 0% 0%, plum, purple, orange, green, red, blue, peru, yellow);
        }

        .a18 {
            background: radial-gradient(circle at 75% 75%, plum, purple, orange, green, red, blue, peru, yellow);
        }

        /* right top, left bottom,bottom left,top right,etc */
        .a19 {
            background: radial-gradient(circle at right top, plum, purple, orange, green, red, blue, peru, yellow);
        }

        .a20 {
            background: radial-gradient(circle at right bottom, plum, purple, orange, green, red, blue, peru, yellow);
        }

        .a21 {
            background: repeating-radial-gradient(circle at 50% 50%, plum 5%, purple 10%, orange 15%, green 20%, red 25%, blue 30%, peru 35%, yellow 40%);
        }

        .a22 {
            background: repeating-radial-gradient(circle at right bottom, plum 5%, purple 10%, orange 15%, green 20%, red 25%, blue 30%, peru 35%, yellow 40%);
        }
        .a23{
            background: conic-gradient(red,yellow,orange,green,blue,plum,purple,peru,skyblue,purple,aqua,teal,pink,white,lightblue,lightgreen,lightpink);
        }
        /* strating & ending color are same */
         .a24{
            background: conic-gradient(red,yellow,orange,green,blue,plum,purple,peru,skyblue,purple,aqua,teal,pink,white,lightblue,lightgreen,lightpink,red);
        }
         .a25{
            background:repeating-conic-gradient(red,purple 2%,aqua 4% ,teal 6%,pink,white,lightblue,lightgreen,lightpink,yellow,orange,green,blue 78%,plum,purple,peru,skyblue,
            lightblue,lightyellow,blue,red);
        }
         .a26{
            background:repeating-conic-gradient(red,purple 4deg,aqua 10deg ,teal 30%,pink,white,lightblue,lightgreen,lightpink,yellow,orange,green,blue 90%,plum,purple,peru,skyblue,
            lightblue,lightyellow,blue,red);
        }
        .a27{
            background: linear-gradient(blue,20%,red);
        }
    </style>
</head>

<body>
    <div class="a1"></div>
    <div class="a2"></div>
    <div class="a3"></div>
    <div class="a4"></div>
    <div class="a5"></div>
    <div class="a6"></div>
    <div class="a7"></div>
    <div class="a8"></div>
    <div class="a9"></div>
    <div class="a10"></div>
    <div class="a11"></div>
    <div class="a12"></div>
    <div class="a13"></div>
    <div class="a14"></div>
    <div class="a15"></div>
    <div class="a16"></div>
    <div class="a17"></div>
    <div class="a18"></div>
    <div class="a19"></div>
    <div class="a20"></div>
    <div class="a21"></div>
    <div class="a22"></div>
    <div class="a23"></div>
    <div class="a24"></div>
    <div class="a25"></div>
    <div class="a26"></div>
    <div class="a27"></div>
    








</body>

</html>
