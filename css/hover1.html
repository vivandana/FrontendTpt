<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>
    <style>
        h1{
            background-color: plum;
            border: 10px solid purple;
            color: black;
            text-align: center;
            font-size: 50px;
        }
        h1:hover{
            background-color: aqua;
            border: 10px groove green;
            color: white;
            /* transition: 3s; */
            transition: all 4s;
            /* transition: color 5s,background-color 1s; */
        }
    </style>
</head>
<body>
    <h1>Hello</h1>
</body>
</html>
