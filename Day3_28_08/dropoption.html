<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTION GROUP</title>
</head>
<body>
    <h1>DROPDOWN LIST WITH OPTION GROUP</h1>
    <select>

        <optgroup label="FrontEnd Technology">
            <OPTION>HTML</OPTION>
            <OPTION>CSS</OPTION>
            <OPTION>JS</OPTION>
            <OPTION>Angular</OPTION>
            <OPTION>React</OPTION>
            <OPTION>Bootstrap</OPTION>
            <OPTION>Tailwind</OPTION>
            <OPTION disabled>JQuery</OPTION>
        </optgroup>
        <optgroup label="BAckEnd Technology">
            <option>ASP.NET Core</option>
            <option>Java Hibarnate</option>
            <option disabled>JSP</option>
            <option>Django</option>
            <option>Laravel</option>
        </optgroup>
    </select>


    
</body>
</html>
