<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DROPDOWN LIST | COMBO BOX</title>
</head>
<body>
    <H1>DROPDOWN LIST || COMBO BOX</H1>
    <hr>
       <!-- DROPDOWN LIST -->
        <h3>single selection</h3>
     <select name="" id="">
        <option value="" disabled>Select your Course</option>
        <option value="">MERN Stack</option>
        <option value="">.NET</option>
        <option value="" selected >MEAN Stack</option>
        <option value="" >JAVA Hibernate</option>
     </select>
<br><br><br>
        <h3>multiple selection --- select multiple option using ctrl btn</h3>

<!-- multiple selection    it work with ctrl button... -->
     <select name="" id="" multiple>
        <option value="" disabled>Select your Course</option>
        <option value="">MERN Stack</option>
        <option value="">.NET</option>
        <option value="" selected >MEAN Stack</option>
        <option value="" >JAVA Hibernate</option>
     </select>


     <br><br><br>


     <h1>for upload multiple files -- its also works with ctrl btn</h1>

     FileUpload
     <input type="file" multiple>


     <br><br><br>

     
</body>
</html>
