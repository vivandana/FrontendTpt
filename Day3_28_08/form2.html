<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - 2</title>
</head>
<body>
    <h2>For input multiple line -- use textarea tag</h2>
    <hr>
    <fieldset style="width: 180px;">
        <legend>Web Form</legend>
    <label for="">
    Name  <br>
    <!-- size atrr use for control width of input  -->
    <input type="text" size="30">
    </label>
    <br><br>
    <label>
    Message  <br>
    <!-- rows use for increase height
        cols use for increase width -->
    <textarea style="resize: none;" rows="5" cols="30"></textarea>
    </label>
    </fieldset>


 
</body>
</html>
