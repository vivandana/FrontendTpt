<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placeholder ///// Min - Max</title>
</head>

<body>

    <h1>Use of placeholder</h1>
    <fieldset style="width: 180px;">
        <legend>Sample text</legend>
        <br>
        Today's Date <input type="text" value="28/08/2025" readonly><br><br>
        Name <input type="text" placeholder="Enter Your Name"><br><br>
        Email <input type="email" placeholder="Enter your Email"><br><br>
        Password <input type="password" placeholder="Enter your Password"><br><br>
    </fieldset>


    <h1>Use of tabindex</h1>
    <fieldset style="width: 200px;">
        <legend>tabindex</legend>
        Name <input tabindex="1" type="text" placeholder="Enter Your Name"><br><br>
        Email <input  tabindex="3" type="email" placeholder="Enter your Email"><br><br>
        Password <input tabindex="2" type="password" placeholder="Enter your Password"><br><br>
    </fieldset>


    
</body>

</html>
