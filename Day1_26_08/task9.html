<!--  Show a heading where half the text is in red and the other half in 
blue using <font>. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><font color="red">This is </font><font color="blue">Heading....</font></h1>
</body>
</html>
