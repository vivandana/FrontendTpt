in a custom font.  -->
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <font color="green"><i><b>Combine <font> with <b> and <i> to show bold + italic styled text 
in a custom font. </b></i></font>
  </body>
  </html>
