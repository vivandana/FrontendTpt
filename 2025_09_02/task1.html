<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rowspan , colspan</title>
</head>
<body>
    <table border="1" width="20%" >
        <tr>
             <td>A</td>
            <td colspan="2">B</td> 
        </tr>
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
        </tr>
        <tr>
              <td rowspan="2">A</td>
            <td>B</td>
            <td>C</td>
        </tr>
        <tr>
              
            <td>B</td>
            <td>C</td>
        </tr>
    </table>


    <hr>

    <table border="2" width="20%">
        <tr align="center">
            <td>Name</td>
            <td>Email</td>
        </tr>
        <tr align="center">
             <td>Raman</td>
            <td>raman@gmail.com</td>
        </tr>
        <tr align="center">
             <td>Ram</td>
            <td>ram@gmail.com</td>
        </tr>
        <tr align="center">
             <td colspan="2" align="center">Designation: XYZ</td>
        </tr>
    </table>


    <hr>
</body>
</html>
