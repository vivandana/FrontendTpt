<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body{
            background-color: white;

        }
        input{
            width: 150px;
            height: 30px;
        }
    </style>
</head>
<body>
    <h1>Simple job application Form</h1>
    <form action="">
        Full name  <br><input style="width: 400px;" type="text" placeholder="Enter your name & surname"><br><br>
        Email address  <br> <input style="width: 400px;" type="email" placeholder="Enter your email"><br><br>
        Address <br> <input style="width: 400px;" type="text" placeholder="1234 Main Str"> <br><br>
        City <input type="text" placeholder="Istanbul">
        Zip <input type="text" placeholder="340000"><br><br>
        Telephone <input  style="width: 320px;" type="number" placeholder="1-(5555)-555-55555"> <br><br>
        Start Date <input  style="width: 320px;" type="date"> <br><br>
        Upload Your File <input  type="file" name="" id=""><br><br>
<input type="submit" value="Submit" style="background-color: blue; color: white; border: white; width: 80px;">
    </form>
</body>
</html>
