<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            height: 1000px;
            width: 1300px;
        }
        #top{
            height: 500px;
            width: 1300px;
            background-color: lightblue;
        }
        
        #bottom{
            height: 500px;
            width: 1300px;
           background-color: lightgrey;
        }
        #left{
            height: 500px;
            width: 500px;
            float: left;
            background-color: red;
        }
        #center{
            height: 500px;
            width: 300px;
            float: left;
            background-color: green;
        }
        #right{
            height: 500px;
            width: 500px;
            float: left;
            background-color: yellow;
        }
        #bottom-left{
            height: 500px;
            width: 500px;
            float: left;
            background-color: purple;
        }
        #bottom-center{
            height: 500px;
            width: 300px;
            float: left;
            background-color: orange;
        }
        #bottom-right{
            height: 500px;
            width: 500px;
            float: left;
            background-color: pink;
        }
        #a-1{
            height: 500px;
            width: 250px;
            background-color: blue;
            float: left;
        }
        #a-2{
            height: 500px;
            width: 250px;
            background-color: brown;
            float: left;
        }
        #c-1{
            height: 500px;
            width: 250px;
            background-color: cyan;
            float: left;
        }
        #c-2{
            height: 500px;
            width: 250px;
            background-color: magenta;
            float: left;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="top">
            <div id="left"></div>
            <div id="center"></div>
            <div id="right"></div>
        </div>
        <div id="bottom">
            <div id="bottom-left">
                <div id="a-1"></div>
                <div id="a-2"></div>
            </div>
            <div id="bottom-center"></div>
            <div id="bottom-right">
                <div id="c-1"></div>
                <div id="c-2"></div>
            </div>
        </div>
    </div>
</body>
</html>
