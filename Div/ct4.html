<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div-4</title>
    <style>
        #main{
            height: 900px;
            width: 900px;

        }
        #a{
            height: 100px;
            width: 900px;
            background-color: red;
        }
        #b{
            height: 800px;
            width: 900px;
        }
        #left{
            height: 800px;
            width: 100px;
            float: left;
            background-color: goldenrod;
        }
        #right{
            height: 800px;
            width: 800px;
            float: left;
        }
        #top{
            height: 200px;
            width: 800px;
            background-color: blue;
        }
        #bottom{
            height: 600px;
            width: 800px;
        }
        #bleft{
            height: 600px;
            width: 300px;
            float: left;
            background-color: chartreuse;
        }
         #bright{
            height: 600px;
            width: 500px;
            float: left;
        }
        #m{
            height: 300px;
            width: 500px;
            background-color: cyan;
        }
         #n{
            height: 300px;
            width: 500px;
        }
        #nleft{
             height: 300px;
            width: 250px;
            float: left;
            background-color: red;
        }
         #nright{
             height: 300px;
            width: 250px;
            float: left;
        }
        #nrighttop{
            height: 150px;
            width: 250px;
            background-color: lightblue;
        }
        #nrightbottom{
            height: 150px;
            width: 250px;
            background-color: lightseagreen;
        }


    </style>
</head>
<body>
    <div id="main">
        <div id="a"></div>
        <div id="b">
            <div id="left"></div>
            <div id="right">
                <div id="top"></div>
                <div id="bottom">
                    <div id="bleft"></div>
                    <div id="bright">
                        <div id="m"></div>
                        <div id="n">
                            <div id="nleft"></div>
                            <div id="nright">
                                <div id="nrighttop"></div>
                                <div id="nrightbottom"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
