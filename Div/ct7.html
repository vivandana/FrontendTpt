<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main {
            height: 700px;
            width: 1000px;
        }

        #top {
            height: 300px;
            width: 1000px;
        }

        #tleft {
            height: 300px;
            width: 500px;
            float: left;
            background-color: red;
        }

        #tcenter {
            height: 300px;
            width: 200px;
            float: left;
            background-color: rgb(86, 51, 51);
        }

        #tright {
            height: 300px;
            width: 300px;
            float: left;
            background-color: green;

        }

        #bottom {
            height: 400px;
            width: 1000px;
            background-color: yellow;
        }

        #bleft {
            height: 400px;
            width: 500px;
            float: left;
            background-color: black;
        }

        #bcenter {
            height: 400px;
            width: 200px;
            float: left;
            background-color: wheat;
        }

        #bright {
            height: 400px;
            width: 300px;
            float: left;
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="top">
            <div id="tleft"></div>
            <div id="tcenter"></div>
            <div id="tright"></div>
        </div>
        <div id="bottom">
            <div id="bleft"></div>
            <div id="bcenter"></div>
            <div id="bright"></div>
        </div>



    </div>
</body>

</html>
