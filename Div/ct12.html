<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div-third-last</title>
    <style>
        #main{
            height: 1000px;
            width: 1200px;
        }
        #left{
            height: 1000px;
            width: 100px;
            float: left;
            background-color: red;
        }
        #right{
            height: 1000px;
            width: 1100px;
            float: left;
            background-color: yellow;
        }
        #top{
            height: 100px;
            width: 1100px;
            background-color: lightblue;
        }
        #bottom{
            height: 900px;
            width: 1100px;
           background-color: lightgrey;
        }
        #bottom-left{
            height: 900px;
            width: 1000px;
            float: left;
            background-color: purple;
        }
        #bottom-right{
            height: 900px;
            width: 100px;
            float: left;
            background-color: pink;
        }
        #a-1{
            height: 100px;
            width: 1000px;
            background-color: blue;
        }
        #a-2{
            height: 600px;
            width: 1000px;
            background-color: orange;
        }
        #a-2-left{
            height: 600px;
            width: 200px;
            float: left;
            background-color: black;
        }
        #a-2-center{
            height: 600px;
            width: 600px;
            float: left;
            background-color: green;
        }
        #a-2-center-1{
            height: 150px;
            width: 600px;
            background-color: brown;
        }
        #a-2-center-2{
            height: 150px;
            width: 600px;
            background-color: lightgrey;
        }
        #m{
            height: 150px;
            width: 300px;
            float: left;
            background-color: red;
        }
        #n{
            height: 150px;
            width: 300px;
            float: left;
            background-color: blue;
        }
        #a-2-center-3{
            height: 150px;
            width: 600px;
            background-color: lightpink;
        }
        #x{
            height: 150px;
            width: 300px;
            float: left;
            background-color: purple;
        }
        #y{
            height: 150px;
            width: 300px;
            float: left;
            background-color: orange;
        }
        #a-2-center-4{
            height: 150px;
            width: 600px;
            background-color: lightgreen;
        }
        #a-2-right{
            height: 600px;
            width: 200px;
            float: left;
            background-color: plum;
        }
       #a-3{
            height: 100px;
            width: 1000px;
            background-color: brown;
        }
        #a-4{
            height: 100px;
            width: 1000px;
            background-color: green;
        }
      
    </style>
</head>
<body>
    <div id="main">
        <div id="left"></div>
        <div id="right">
            <div id="top"></div>
           <div id="bottom">
                <div id="bottom-left">
                    <div id="a-1"></div>
                    <div id="a-2">
                        <div id="a-2-left"></div>
                        <div id="a-2-center">
                            <div id="a-2-center-1"></div>
                            <div id="a-2-center-2">
                                <div id="m"></div>
                                <div id="n"></div>
                            </div>
                            <div id="a-2-center-3">
                                <div id="x"></div>
                                <div id="y"></div>
                            </div>
                            <div id="a-2-center-4"></div>
                        </div>
                        <div id="a-2-right"></div>
                    </div>
                    <div id="a-3"></div>
                    <div id="a-4"></div>
                </div>
                <div id="bottom-right"></div>
           </div>
    </div>
</body>
</html>
