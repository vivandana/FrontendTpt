<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div-last</title>
    <style>
        #main{
            height: 1000px;
            width: 1200px;
        }
        #top{
            height: 500px;
            width: 1200px;
            background-color: lightblue;
        }
        #bottom{
            height: 500px;
            width: 1200px;
           background-color: lightgrey;
        }
        #left{
            height: 500px;
            width: 600px;
            float: left;
            background-color: red;
        }
        #right{
            height: 500px;
            width: 600px;
            float: left;
            background-color: yellow;
        }
        #a{
            height: 500px;
            width: 100px;
            float: left;
            background-color: blue;
        }
        #b{
            height: 500px;
            width: 500px;
            float: left;
            background-color: orange;
        }
        #b-1{
            height: 400px;
            width: 500px;
            background-color: pink;
        }
        #b-2{
            height: 100px;
            width: 500px;
            background-color: brown;
        }
        #c{
            height: 100px;
            width: 600px;
            float: left;
            background-color: purple;
        }
        #d{
            height: 400px;
            width: 600px;
            float: left;
            background-color: green;
        }
        #d-1{
            height: 400px;
            width: 100px;
            float: left;
            background-color: grey;
        }
        #d-2{
            height: 400px;
            width: 500px;
            float: left;
            background-color: black;
        }
        #bleft{
            height: 500px;
            width: 600px;
            float: left;
            background-color: brown;
        }
        
        #bleft-1{
            height: 400px;
            width: 600px;
            background-color: magenta;
        }
        #bleft-1-1{
            height: 400px;
            width: 500px;
            float: left;
            background-color: purple;
        }
        #bleft-1-2{
            height: 400px;
            width: 100px;
            float: left;
            background-color: orange;
        }
        #bleft-2{
            height: 100px;
            width: 600px;
            background-color: pink;
        }
        #bright{
            height: 500px;
            width: 600px;
            float: left;
            background-color: cyan;
        }
        #bright-1{
            height: 500px;
            width: 500px;
            float: left;
            background-color: lightgreen;
        }
          #bright-1-1{
            height: 100px;
            width: 500px;
            background-color: lightgrey;
        }
        #bright-1-2{
            height: 400px;
            width: 500px;
            background-color: lightblue;
        }
         #bright-2{
            height: 500px;
            width: 100px;
            float: left;
            background-color: lightpink;
        }
      
       

    </style>
</head>
<body>
    <div id="main">
        <div id="top">
            <div id="left">
                <div id="a"></div>
                <div id="b">
                    <div id="b-1"></div>
                    <div id="b-2"></div>
                </div>
            </div>
            <div id="right">
                <div id="c"></div>
                <div id="d">
                    <div id="d-1"></div>
                    <div id="d-2"></div>
                </div>
            </div>
        </div>
        <div id="bottom">
            <div id="bleft">
                <div id="bleft-1">
                    <div id="bleft-1-1"></div>
                    <div id="bleft-1-2"></div>
                </div>
                <div id="bleft-2"></div>
            </div>
            <div id="bright">
                <div id="bright-1">
                    <div id="bright-1-1"></div>
                    <div id="bright-1-2"></div>
                </div>
                <div id="bright-2">
                    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
