<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        .calc{
           min-height: 400px;
            width:300px;
            background-color: gainsboro;
            border-radius:10px;
            margin: 50px auto;
            padding: 50px;
            box-sizing: border-box;
        }

        #txt{
            height: 50px;
            width: 190px;
            background-color: whitesmoke;
            border: none;
            resize: none;
            border-radius: 50%;
            font-size: 25px;
            color: black;
            text-align: right;
            margin: 5px;
            box-sizing: border-box;
        }
        .row{
            height: 50px;
            width: 200px;
           
        }
        .col{
            height:40px ;
            width: 40px;
            float: left;
            border: black solid 1px;
            box-sizing: border-box;
            margin: 5px;
            border-radius: 50%;
            font-size: 25px;
            font-weight: bold;
            padding-left: 12px;
            padding-top: 5px;

        }

        .a{
            color: white;
            background-color: black;
        }
        .del{
                color: white;
            background-color: red;
        }


    </style>
</head>
<body>
    <div class="calc">
        <textarea name="" id="txt">0</textarea>
        <div class="row">
            <div class="col">0</div>
            <div class="col">1</div>
            <div class="col">2</div>
            <div class="col a">+</div>
        </div>
        <div class="row">
            <div class="col">3</div>
            <div class="col">4</div>
            <div class="col">5</div>
            <div class="col a">-</div>
        </div>
        <div class="row">
            <div class="col">6</div>
            <div class="col">7</div>
            <div class="col">8</div>
            <div class="col a">*</div>
        </div>
        <div class="row">
            <div class="col">9</div>
            <div class="col a">/</div>
            <div class="col a">=</div>
            <div class="col del">C</div>
        </div>
      
    </div>
</body>
</html>
