<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div-2</title>
    <style>
        #main{
            height: 900px;
            width: 900px;
            background-color: red;
        }
        #a{
            height: 900px;
            width: 200px;
            float: left;
            background-color: plum;
        }
         #b{
            height: 900px;
            width: 500px;
            float: left;
            background-color: purple;
        }
        #p{
             height: 300px;
            width: 500px;
            background-color: white;
        }
        #q{
             height: 300px;
            width: 500px;
            background-color: red;
        }
        #m{
            height: 300px;
            width: 150px;
            float: left;
            background-color: cadetblue;
        }
        #n{
            height: 300px;
            width: 200px;
            float: left;
            background-color: blue;
        }
        #o{
            height: 300px;
            width: 150px;
            float: left;
            background-color: chocolate;
        }
        #r{
             height: 300px;
            width: 500px;
            background-color: white;
        }
        #c{
            height: 900px;
            width: 200px;
            float: left;
            background-color: plum;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="a"></div>
        <div id="b">
            <div id="p"></div>
            <div id="q">
                <div id="m"></div>
                <div id="n"></div>
                <div id="o"></div>
            </div>
            <div id="r"></div>
        </div>
        <div id="c"></div>
    </div>
</body>
</html>
