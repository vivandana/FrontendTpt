<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc3</title>
    <style>
        .calc{
            height: 600px;
            width: 400px;
            background-color: pink;
            padding: 50px;
            box-sizing: border-box;
            border-radius: 20px;
        }
        .container{
            height: 500px;
            width: 300px;
            background-color: white;
            border-radius: 20px;
            padding-left: 20px;
            padding-top: 10px;
            box-sizing: border-box;
        }
        #txt{
            height: 50px;
            width: 250px;
            margin: 5px;
            border-radius: 10px;
            border: none;
            resize: none;
        }

        .row{
            height: 70px;
            width: 250px;
            /* background-color: red; */
            margin: 5px;
            
        }
        .col{
            height: 70px;
            width: 60px;
            background-color: pink;
            margin: 1px;
            margin-top: 5px;
            float: left;
            line-height: 76px;
            text-align: center;

        }
        .a{
            color: red;
        }
   </style>
</head>
<body>
    <div class="calc">
        <div class="container">
            <textarea name="" id="txt"></textarea>
            <div class="row">
                <div class="col a">AC</div>
                <div class="col a">DEL</div>
                <div class="col a">%</div>
                <div class="col a">/</div>
            </div>
            <div class="row">
                 <div class="col">7</div>
                <div class="col">8</div>
                <div class="col">9</div>
                <div class="col a">*</div>
            </div>
            <div class="row">
                 <div class="col">4</div>
                <div class="col">5</div>
                <div class="col">6</div>
                <div class="col a">-</div>
            </div>
            <div class="row">
                 <div class="col">1</div>
                <div class="col">2</div>
                <div class="col">3</div>
                <div class="col a">+</div>
            </div>
            <div class="row">
                 <div class="col">0</div>
                <div class="col">00</div>
                <div class="col a">.</div>
                <div class="col a">=</div>
            </div>
        </div>
    </div>
</body>
</html>
