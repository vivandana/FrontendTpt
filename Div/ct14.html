<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div</title>
    <style>
        #main {
            height: 1000px;
            width: 1200px;
        }
        #a {
            height: 1000px;
            width: 100px;
            float: left;
            background-color: red;
        }
        #a-1{
            height: 500px;
            width: 100px;
            background-color: aliceblue;
        }
        #a-2{
            height: 500px;
            width: 100px;
            background-color: blue;
        }
        #b {
            height: 1000px;
            width: 100px;
            float: left;
            background-color: yellowgreen;
        }
        #b-1{
            height: 500px;
            width: 100px;
            background-color: green;
        }
        #b-2{
            height: 500px;
            width: 100px;
            background-color: wheat;
        }
        #c {
            height: 1000px;
            width: 600px;
            float: left;
            background-color: blueviolet;
        }
        #c-1{
            height: 100px;
            width: 600px;
            background-color: antiquewhite;
        }
        #c-1-1{
            height: 100px;
            width: 300px;
            float: left;
            background-color: pink;
        }
        #c-1-2{
            height: 100px;
            width: 300px;
            float: left;
            background-color: green;
        }
        #c-2{
            height: 800px;
            width: 600px;
            background-color: red;
        }
        #m{
            height: 800px;
            width: 100px;
            float: left;
            background-color: coral;
        }
        #n{
             height: 800px;
            width: 400px;
            float: left;
            background-color: burlywood;
        }
        #p{
            height: 400px;
            width: 400px;
            background-color: cadetblue;
        }
        #x{
            height: 400px;
            width: 100px;
            float: left;
            background-color: yellow;
        }
        #y{
            height: 400px;
            width: 200px;
            float: left;
            background-color: green;
        }
        #c-2-2-1-3{
            height: 400px;
            width: 100px;
            background-color: cadetblue;
        }
        #q{
            height: 400px;
            width: 400px;
            background-color: cornflowerblue;
        }
        #c-2-3{
             height: 800px;
            width: 100px;
            float: left;
            background-color: crimson;
        }
        #c-3{
            height: 100px;
            width: 600px;
            background-color: antiquewhite;
        }
        #d {
            height: 1000px;
            width: 100px;
            float: left;
            background-color: chartreuse;
        }
        #d1{
             height: 500px;
            width: 100px;
            background-color: darkgoldenrod;
        }
        #d2{
             height: 500px;
            width: 100px;
            background-color: brown;
        }
        #e {
            height: 1000px;
            width: 100px;
            float: left;
            background-color: darkred;
        }
        #e1{
           
             height: 500px;
            width: 100px;
            background-color: royalblue;
        }
        #e2{
             height: 500px;
            width: 100px;
            background-color: rosybrown;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="a">
            <div id="a-1"></div>
            <div id="a-2"></div>
        </div>
        <div id="b">
            <div id="b-1"></div>
            <div id="b-2"></div>
        </div>
        <div id="c">
            <div id="c-1">
                <div id="c-1-1"></div>
                <div id="c-1-2"></div>
            </div>
            <div id="c-2">
                <div id="m"></div>
                <div id="n">
                    <div id="p">
                        <div id="x"></div>
                        <div id="y"></div>
                    </div>
                    <div id="q"></div>
                </div>
                <div id="o"></div>
            </div>
            <div id="c-3">
                <div id="c-1-1"></div>
                <div id="c-1-2"></div>
            </div>
        </div>
        <div id="d">
            <div id="d1"></div>
            <div id="d2"></div>
        </div>

        <div id="e">
            <div id="e1"></div>
            <div id="e2"></div>
        </div>

    </div>
</body>

</html>
