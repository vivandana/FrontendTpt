<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div-3</title>
    <style>
        #main{

            height: 900px;
            width: 900px;
        }
        #a{
            height: 100px;
            width: 900px;
            background-color: blue;
        }
        #b{
            height: 900px;
            width: 900px;
            background-color: blueviolet;
        }

        #m{
            height: 900px;
            width:100px ;
            float: left;
            background: black;
        }
           #n{
            height: 900px;
            width:700px ;
            float: left;
            background-color: bisque;
        }
        #n1{
              height: 400px;
            width:700px ;
            background-color: chartreuse;
        }
        #i{
            height: 400px;
            width: 350px;
            float: left;
            background-color: aquamarine;
        }
         #j{
            height: 400px;
            width: 350px;
            float: left;
            background-color: aqua;
        }
        #n2{
              height: 400px;
            width:700px ;
            background-color: cadetblue;
        }
         #k{
            height: 400px;
            width: 350px;
            float: left;
            background-color: red;
        }
         #l{
            height: 400px;
            width: 350px;
            float: left;
            background-color: green;
        }
        #n3{
              height: 100px;
            width:700px;
            background-color: burlywood;
        }


           #o{
            height: 900px;
            width:100px ;
            background-color: chocolate;
        }

    </style>
</head>
<body>
    <div id="main">
        <div id="a"></div>
        <div id="b">
            <div id="m"></div>
            <div id="n">
                <div id="n1">
                    <div id="i"></div>
                    <div id="j"></div>
                </div>
                <div id="n2">
                    <div id="k"></div>
                    <div id="l"></div>
                </div>
                <div id="n3"></div>
            </div>
            <div id="o"></div>
        </div>
    </div>
</body>
</html>
