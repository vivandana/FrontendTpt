<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    #outer
    {
      height: 850px;
      width: 500px;
      background:rgb(159, 159, 159);
      border-radius: 15px;
      box-sizing: border-box;
      border: 2px solid gray;
    }
    #upper
    {
      min-height: 200px;
      width: 100%;
      text-align: end;
      box-sizing: border-box;
      font-weight: bolder;
      background:rgb(159, 159, 159);
      padding: 25px;
    }
    #inp1
    {
      font-size: 40px;
      background:rgb(159, 159, 159) !important;
      height: 100px;
      width: 100%;
    }
    #inp2
    {
      font-size: 50px;
      color: black;
    }
    .org
    {
      color: black;
    }
    .green
    {
      background: rgb(52, 54, 52) !important;
      color: white;
    }
    .red
    {
      background: red !important;
      color: white;
    }

    #lower
    {
      background:rgb(159, 159, 159);
      height: 630px;
      width: 100%;
      margin: 0px;
      padding:15px;
      box-sizing: border-box;
      border-radius: 20px;

    }
    .row
    {
      height: 100px;
      width: 100%;
    }
    .column
    {
      height: 80px;
      width: 100px;
      float: left;
      background: rgb(213, 217, 230);
      border-radius: 10px;
      line-height: 80px;
      font-size: 40px;
      text-align: center;
      margin: 8px;
      box-sizing: border-box;
      font-weight: bolder;
      border: 1px groove rgb(88, 87, 87);
    }
  </style>
</head>
<body>
  <div id="outer">
      <div id="upper">
          <div style="border: 2px solid gray;background:rgb(213, 217, 230) ;padding: 15px;border-radius: 10px;">
          <b style="font-size: 50px;padding-bottom: 0px;margin-bottom:0px ;">260+10=</b>
          <p style="font-size: 100px;padding-bottom: 0px;margin-bottom:0px ;margin-top: 0px;">270</p>
          </div>
      </div>
      <div id="lower">
        <div class="row">
          <div class="column" style="width: 45%;background: pink;">CLEAR</div>
          <div class="column org" style="width: 45%;background-color: rgb(167, 167, 249);">DELETE</div>
        </div>
        <div class="row">
          <div class="column org">%</div>
          <div class="column org">x<sup>2</sup></div>
          <div class="column org">/x</div>
          <div class="column org">%</div>
        </div>
        <div class="row">
          <div class="column">7</div>
          <div class="column">8</div>
          <div class="column">9</div>
          <div class="column org">+</div>
        </div>
        <div class="row">
          <div class="column">4</div>
          <div class="column">5</div>
          <div class="column">9</div>
          <div class="column org">x</div>
        </div>
        <div class="row">
          <div class="column">1</div>
          <div class="column">2</div>
          <div class="column">3</div>
          <div class="column org">+</div>
        </div>
        <div class="row">
          <div class="column org">+/-</div>
          <div class="column">0</div>
          <div class="column org">.</div>
          <div class="column green">=</div>
        </div>
       
      </div>
  </div>
</body>
</html>
