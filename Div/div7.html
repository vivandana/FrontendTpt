<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div-7</title>
    <style>
        #outer{
            height: 600px;
            width: 800px;
            background-color: gray;
        }
        #a{
            height: 600px;
            width: 200px;
            float: left;
            background-color: antiquewhite;
        }
        #a1{
            height: 300px;
            width: 200px;
            background-color: rgb(44, 43, 42);
        }
        #a2{
            height: 300px;
            width: 200px;
            background-color: rgb(175, 100, 24);
        }
        #b{
            height: 600px;
            width: 400px;
            float: left;
            background-color: rgb(115, 70, 11);
        }
        #b1{
            height: 100px;
            width: 400px;
            background-color: rgb(150, 33, 174);
        }
         #b11{
            height: 100px;
            width: 100px;
            float: left;
            background-color: rgb(213, 114, 33);
        }
        #b12{
            height: 100px;
            width: 300px;
            float: left;
            background-color: rgb(217, 201, 26);
        }
        #b2{
            height: 400px;
            width: 400px;
            background-color: rgb(18, 198, 87);
        }
        #b3{
            height: 100px;
            width: 400px;
            background-color: rgb(18, 154, 188);
        }
        #b31{
            height: 100px;
            width: 300px;
            float: left;
            background-color: rgb(217, 201, 26);
        }
        #b32{
            height: 100px;
            width: 100px;
            float: left;
            background-color: rgb(213, 114, 33);
        }
        #c{
            height: 600px;
            width: 200px;
            float: left;
            background-color: rgb(224, 134, 17);
        }
         #c1{
            height: 300px;
            width: 200px;
            background-color: rgb(239, 121, 3);
        }
        #c2{
            height: 300px;
            width: 200px;
            background-color: rgb(175, 100, 24);
        }
    </style>
</head>
<body>
    <div id="outer">
        <div id="a">
            <div id="a1"></div>
            <div id="a2"></div>
        </div>
        <div id="b">
            <div id="b1">
                <div id="b11"></div>
                <div id="b12"></div>
            </div>
            <div id="b2"></div>
            <div id="b3">
                <div id="b31"></div>
                <div id="b32"></div>
            </div>
        </div>
        <div id="c">
            <div id="c1"></div>
            <div id="c2"></div>
        </div>
    </div>
</body>
</html>
