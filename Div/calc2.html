<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calc2</title>
    <style>
        .body{
            height: 700px;
            width: 350px;
            background-color: rgb(205, 205, 219);
            border-radius: 40px;
             padding: 20px;
             box-sizing: border-box;
        }
        .cam{
            height: 200px;
            width: 218px;
            background-color: gainsboro;
               border-radius: 40px;
               border:  4px  groove black;
               box-sizing: border-box;
               padding: 20px;
        }
        .left{
            height: 200px;
            width: 85px;
            float: left;
        }
        .a{
            height: 60px;
            width: 60px;
            border-radius: 50%;
            background-color: black;
            /* border: 10px groove black; */
        }
          .b{
            height: 60px;
            width: 60px;
            border-radius: 50%;
            background-color: black;
            margin: 2px;
            margin-top: 20px;
        }
         .right{
            height: 200px;
            width: 85px;
            float: left;
        }
         .c{
            height: 20px;
            width: 20px;
            margin-left: 30px;
            box-sizing: border-box;
            background-color: black;
            border-radius: 50%;
         }
           .d{
            height: 60px;
            width: 60px;
            border-radius: 50%;
            background-color: black;
            margin: 2px;
            margin-top: 20px;
        }
 .e{
            height: 20px;
            width: 20px;
            margin-left: 25px;
            margin-top: 20px;
            box-sizing: border-box;
            background-color: black;
            border-radius: 50%;
         }
    </style>
</head>
<body>
    <div class="body">
        <div class="cam">
            <div class="left">
                   <div class="a"></div>
            <div class="b"></div>
            </div>
         <div class="right">
             <div class="c"></div>
            <div class="d"></div>
            <div class="e"></div>
         </div>
           
        </div>
    </div>
</body>
</html>
