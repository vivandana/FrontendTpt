<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Border</title>
    <style>
        .outer{
        height: 300px;
        width: 900px;
        background-color: aquamarine;
        }
        .a{
            height: 300px;
            width: 300px;
            background-color: black;
            float: left;
            padding: 20px;
            box-sizing: border-box;
            color: white;
        }
         .b{
            height: 200px;
            width: 250px;
            background-color: green;
            float: left;
            margin: 50px 25px;
        }
         .c{
            height: 258px;
            width: 258px;
            background-color: red;
            float: left; 
            border: 20px groove green;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="a">
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Praesentium, eaque.

            </p>
        </div>
        <div class="b"></div>
        <div class="c"></div>
    </div>
</body>
</html>
